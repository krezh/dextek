---
# yaml-language-server: $schema=https://kubernetes-schemas.plexuz.xyz/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: authentik
  values:
    global:
      podAnnotations:
        secret.reloader.stakater.com/reload: authentik-secret
      deploymentStrategy:
        type: RollingUpdate
      env:
        - name: AUTHENTIK_LISTEN__TRUSTED_PROXY_CIDRS
          value: 10.244.0.0/16
        - name: AUTHENTIK_POSTGRESQL__USE_PGBOUNCER
          value: "false"
        - name: AUTHENTIK_POSTGRESQL__SSLMODE
          valueFrom:
            secretKeyRef:
              name: authentik-postgres
              key: sslmode
        - name: AUTHENTIK_POSTGRESQL__HOST
          valueFrom:
            secretKeyRef:
              name: authentik-postgres
              key: host
        - name: AUTHENTIK_POSTGRESQL__USER
          valueFrom:
            secretKeyRef:
              name: authentik-postgres
              key: username
        - name: AUTHENTIK_POSTGRESQL__PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-postgres
              key: password
        - name: AUTHENTIK_POSTGRESQL__NAME
          valueFrom:
            secretKeyRef:
              name: authentik-postgres
              key: database
      envFrom:
        - secretRef:
            name: authentik-secret
    prometheus:
      rules:
        enabled: true
    server:
      replicas: 2
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
      ingress:
        enabled: false
    worker:
      replicas: 2
      lifecycle:
        postStart:
          exec:
            command:
              - /bin/sh
              - -c
              - |
                python3 - <<'PY' &
                import json
                import os
                import time
                from urllib.error import URLError
                from urllib.request import Request, urlopen
                base_url = "http://authentik-server.auth.svc.cluster.local/api/v3"
                headers = {"Authorization": f"Bearer {os.environ['AUTHENTIK_BOOTSTRAP_TOKEN']}"}
                while True:
                    try:
                        with urlopen(Request(f"{base_url}/root/config/", headers=headers), timeout=5):
                            break
                    except (URLError, TimeoutError):
                        time.sleep(2)
                url = (
                    f"{base_url}/tasks/schedules/"
                    "?actor_name=authentik.outposts.tasks.outpost_controller&page_size=100"
                )
                with urlopen(Request(url, headers=headers), timeout=5) as response:
                    schedules = json.load(response)["results"]
                for schedule in schedules:
                    request = Request(
                        f"{base_url}/tasks/schedules/{schedule['id']}/send/",
                        headers=headers,
                        method="POST",
                    )
                    with urlopen(request, timeout=5):
                        pass
                PY
