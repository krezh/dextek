---
# yaml-language-server: $schema=https://kubernetes-schemas.plexuz.xyz/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tofu-controller
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: tofu-controller
  values:
    awsPackage:
      repository: ghcr.io/flux-iac/aws-primitive-modules
      tag: v4.38.0-v1alpha11
    image:
      repository: ghcr.io/flux-iac/tofu-controller
      pullPolicy: IfNotPresent
      tag: v0.16.5
    runner:
      image:
        repository: ghcr.io/home-operations/opentofu-runner
        tag: 1.12.6@sha256:305e14b33a5bb95dfd36459df1d12800fe87e3fcf8cf39e9759f9212aef4079d
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
