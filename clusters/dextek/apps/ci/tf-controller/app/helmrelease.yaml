---
# yaml-language-server: $schema=https://kubernetes-schemas.plexuz.xyz/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tofu-controller
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: tofu-controller
  values:
    awsPackage:
      repository: ghcr.io/flux-iac/aws-primitive-modules
      tag: v4.38.0-v1alpha11
    image:
      repository: ghcr.io/flux-iac/tofu-controller
      pullPolicy: IfNotPresent
      tag: v0.16.6
    runner:
      image:
        repository: ghcr.io/home-operations/opentofu-runner
        tag: 1.13.2@sha256:9bf98a36cfa5511412cc5e75ba0b6835ecc0b02e9426054c67c50000b4702e60
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
