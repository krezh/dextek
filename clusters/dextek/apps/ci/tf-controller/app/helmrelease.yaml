---
# yaml-language-server: $schema=https://kubernetes-schemas.plexuz.xyz/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tofu-controller
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: tofu-controller
  values:
    awsPackage:
      repository: ghcr.io/flux-iac/aws-primitive-modules
      tag: v4.38.0-v1alpha11
    image:
      repository: ghcr.io/flux-iac/tofu-controller
      pullPolicy: IfNotPresent
      tag: v0.16.5
    runner:
      image:
        repository: ghcr.io/home-operations/opentofu-runner
        tag: 1.13.0@sha256:ac33e5d42b16b5a5b8c2ccbc9ad612d8a71ba980f11a8060199e373014c5c363
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
