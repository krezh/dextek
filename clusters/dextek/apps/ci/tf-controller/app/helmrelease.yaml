---
# yaml-language-server: $schema=https://kubernetes-schemas.plexuz.xyz/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tofu-controller
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: tofu-controller
  values:
    awsPackage:
      repository: ghcr.io/flux-iac/aws-primitive-modules
      tag: v4.38.0-v1alpha11
    image:
      repository: ghcr.io/flux-iac/tofu-controller
      pullPolicy: IfNotPresent
      tag: v0.16.5
    runner:
      image:
        repository: ghcr.io/home-operations/opentofu-runner
        tag: 1.13.1@sha256:3df808853d76695a2014b96b8770dd674e150b7bbceb0d9e15a7e28988f8af89
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
