---
# yaml-language-server: $schema=https://kubernetes-schemas.plexuz.xyz/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tofu-controller
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: tofu-controller
  values:
    awsPackage:
      repository: ghcr.io/flux-iac/aws-primitive-modules
      tag: v4.38.0-v1alpha11
    image:
      repository: ghcr.io/flux-iac/tofu-controller
      pullPolicy: IfNotPresent
      tag: v0.16.6
    runner:
      image:
        repository: ghcr.io/home-operations/opentofu-runner
        tag: 1.13.9@sha256:25cf04047b733ce372be192d939e243f3909a48a31a719958bc1ce8b1bedef4a
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
