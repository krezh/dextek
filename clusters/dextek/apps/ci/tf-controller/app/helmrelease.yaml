---
# yaml-language-server: $schema=https://kubernetes-schemas.plexuz.xyz/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tofu-controller
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: tofu-controller
  values:
    awsPackage:
      repository: ghcr.io/flux-iac/aws-primitive-modules
      tag: v4.38.0-v1alpha11
    image:
      repository: ghcr.io/flux-iac/tofu-controller
      pullPolicy: IfNotPresent
      tag: v0.16.6
    runner:
      image:
        repository: ghcr.io/home-operations/opentofu-runner
        tag: 1.13.8@sha256:499e0dfbcf80a92ad31c3320c95b6082746cbd3e481b960ab69e5995c0b192f5
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
