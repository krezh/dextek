---
# yaml-language-server: $schema=https://kubernetes-schemas.plexuz.xyz/renovate-operator.mogenius.com/renovatejob_v1alpha1.json
apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: github
spec:
  image: ghcr.io/krezh/renovate-nix:44.167.0@sha256:b70e89f1ff495a9236a396b3bca1217f45c46b4dd97fa9fbbc799d47d2943e80
  discoverTopics:
    - renovate
  discoveryFilters:
    - krezh/*
  extraEnv:
    - name: LOG_LEVEL
      value: debug
    - name: RENOVATE_ONBOARDING_CONFIG_FILE_NAME
      value: .renovaterc.json5
    - name: RENOVATE_REDIS_URL
      value: "redis://dragonfly.databases.svc:6379/3"
    - name: RENOVATE_ALLOWED_COMMANDS
      value: |
        [
          "^nix run github:purpleclay/go-overlay#govendor",
          "^bash .github/scripts/update-hash.sh",
          "^nix",
        ]
    - name: RENOVATE_HOST_RULES
      value: |
        [
          {
            "matchHost": "ocharted.plexuz.xyz",
            "allowInternal": true
          }
        ]
  parallelism: 10
  schedule: 0 * * * *
  provider:
    name: github
  githubAppReference:
    secretName: renovate-secret
    appIdSecretKey: GITHUB_APP_ID
    installationIdSecretKey: INSTALL_ID
    pemSecretKey: private-key.pem
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
  secretRef: &secret renovate-secret
  webhook:
    enabled: true
    authentication:
      enabled: true
      secretRef:
        name: *secret
        key: OPERATOR_WEBHOOK_KEY
    sync:
      enabled: true
