---
# yaml-language-server: $schema=https://kubernetes-schemas.plexuz.xyz/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: donetick-mcp
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: donetick-mcp-secret
  data:
    - secretKey: DONETICK_API_TOKEN
      remoteRef:
        key: /Kubernetes/DexTek/MCP/DONETICK_API_TOKEN
