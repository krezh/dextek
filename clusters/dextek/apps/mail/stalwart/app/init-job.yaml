---
# yaml-language-server: $schema=https://kubernetes-schemas.plexuz.xyz/batch/job_v1.json
apiVersion: batch/v1
kind: Job
metadata:
  name: stalwart-init
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stalwart-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: apply-plan
          image: docker.io/stalwartlabs/cli:1.0.14
          command:
            - /bin/sh
            - -c
            - |
              until curl -s http://stalwart.mail.svc.cluster.local:8080/healthz/live; do
                echo "Waiting for Stalwart server to be ready..."
                sleep 3
              done
              stalwart-cli --url http://stalwart.mail.svc.cluster.local:8080 --user admin --password "$ADMIN_PASSWORD" apply --file /etc/stalwart-plan/plan.ndjson --json
          env:
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stalwart-secret
                  key: ADMIN_PASSWORD
          volumeMounts:
            - name: plan
              mountPath: /etc/stalwart-plan
              readOnly: true
      volumes:
        - name: plan
          configMap:
            name: stalwart-plan
