---
apiVersion: v1
kind: ConfigMap
metadata:
  name: stalwart-plan
spec:
  data:
    plan.ndjson: |
      {"@type":"upsert","object":"Domain","matchOn":["name"],"value":{"dom-plexuz":{"name":"plexuz.xyz","description":"Primary Mail Domain","certificateManagement":{"@type":"Manual"},"dkimManagement":{"@type":"Automatic"},"dnsManagement":{"@type":"Manual"},"subAddressing":{"@type":"Enabled"}}}}
      {"@type":"update","object":"SystemSettings","value":{"defaultHostname":"mail.plexuz.xyz","defaultDomainId":"#dom-plexuz","proxyTrustedNetworks":["10.244.0.0/16"]}}
      {"@type":"update","object":"Http","value":{"clientIpSource":"xForwardedFor","forwardedHops":1}}
      {"@type":"update","object":"InMemoryStore","value":{"@type":"Redis","url":"redis://dragonfly.databases.svc:6379/4"}}
      {"@type":"update","object":"Coordinator","value":{"@type":"Default"}}
      {"@type":"update","object":"BlobStore","value":{"@type":"Default"}}
      {"@type":"update","object":"SearchStore","value":{"@type":"Default"}}
      {"@type":"upsert","object":"Directory","matchOn":["id"],"value":{"authentik":{"id":"authentik","@type":"Oidc","description":"Authentik OIDC","issuerUrl":"https://sso.plexuz.xyz/application/o/stalwart/","claimUsername":"preferred_username","usernameDomain":"plexuz.xyz","claimGroups":"groups","acceptedAudiences":{"stalwart":true},"opaqueTokenValidation":"introspection","introspectionClientId":"stalwart","introspectionClientSecret":{"@type":"EnvironmentVariable","variableName":"OIDC_CLIENT_SECRET"}}}}
      {"@type":"update","object":"Authentication","value":{"defaultDirectoryId":"authentik"}}
      {"@type":"upsert","object":"Certificate","matchOn":["id"],"value":{"stalwart-cert":{"id":"stalwart-cert","certificate":{"@type":"File","filePath":"/etc/stalwart/certs/tls.crt"},"privateKey":{"@type":"File","filePath":"/etc/stalwart/certs/tls.key"}}}}
      {"@type":"update","object":"SystemSettings","value":{"defaultCertificateId":"stalwart-cert"}}
      {"@type":"upsert","object":"NetworkListener","matchOn":["name"],"value":{"http":{"name":"http","bind":["0.0.0.0:8080"],"protocol":"http","useTls":false}}}
      {"@type":"upsert","object":"NetworkListener","matchOn":["name"],"value":{"smtp":{"name":"smtp","bind":["0.0.0.0:25"],"protocol":"smtp","useTls":true,"implicitTls":false,"overrideProxyTrustedNetworks":["10.244.0.0/16"]}}}
      {"@type":"upsert","object":"NetworkListener","matchOn":["name"],"value":{"smtps":{"name":"smtps","bind":["0.0.0.0:465"],"protocol":"smtp","useTls":true,"implicitTls":true,"overrideProxyTrustedNetworks":["10.244.0.0/16"]}}}
      {"@type":"upsert","object":"NetworkListener","matchOn":["name"],"value":{"submission":{"name":"submission","bind":["0.0.0.0:587"],"protocol":"smtp","useTls":true,"implicitTls":false,"overrideProxyTrustedNetworks":["10.244.0.0/16"]}}}
      {"@type":"upsert","object":"NetworkListener","matchOn":["name"],"value":{"imaps":{"name":"imaps","bind":["0.0.0.0:993"],"protocol":"imap","useTls":true,"implicitTls":true,"overrideProxyTrustedNetworks":["10.244.0.0/16"]}}}
      {"@type":"upsert","object":"NetworkListener","matchOn":["name"],"value":{"pop3s":{"name":"pop3s","bind":["0.0.0.0:995"],"protocol":"pop3","useTls":true,"implicitTls":true,"overrideProxyTrustedNetworks":["10.244.0.0/16"]}}}
      {"@type":"upsert","object":"NetworkListener","matchOn":["name"],"value":{"sieve":{"name":"sieve","bind":["0.0.0.0:4190"],"protocol":"manage-sieve","useTls":true,"implicitTls":false,"overrideProxyTrustedNetworks":["10.244.0.0/16"]}}}
