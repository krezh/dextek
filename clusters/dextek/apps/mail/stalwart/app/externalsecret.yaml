---
# yaml-language-server: $schema=https://kubernetes-schemas.plexuz.xyz/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name stalwart-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        STALWART_RECOVERY_ADMIN: "admin:{{ .ADMIN_PASSWORD }}"
        OIDC_CLIENT_SECRET: "{{ .OIDC_CLIENT_SECRET }}"
  data:
    - secretKey: ADMIN_PASSWORD
      remoteRef:
        key: /Kubernetes/DexTek/Stalwart/ADMIN_PASSWORD
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: /Kubernetes/DexTek/Stalwart/OIDC_CLIENT_SECRET
