---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app stalwart
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: stalwart
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      stalwart:
        type: statefulset
        replicas: 2
        pod:
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: *app
        annotations:
          reloader.stakater.com/auto: "true"
        statefulset:
          volumeClaimTemplates:
            - name: data
              storageClass: ceph-block
              accessMode: ReadWriteOnce
              size: 50Gi
              globalMounts:
                - path: /var/lib/stalwart
        containers:
          app:
            image:
              repository: ghcr.io/stalwartlabs/stalwart
              tag: v1.0.1
            env:
              CONFIG_PATH: /etc/stalwart/config.json
              STALWART_PUBLIC_URL: https://mail.plexuz.xyz
            envFrom:
              - secretRef:
                  name: stalwart-secret
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz/live
                    port: &httpPort 8080
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probe
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
                add:
                  - NET_BIND_SERVICE
    service:
      app:
        controller: stalwart
        type: ClusterIP
        ports:
          http:
            port: *httpPort
          smtp:
            port: 25
          smtps:
            port: 465
          submission:
            port: 587
          imaps:
            port: 993
          pop3s:
            port: 995
          sieve:
            port: 4190
    route:
      app:
        hostnames:
          - mail.plexuz.xyz
          - autoconfig.plexuz.xyz
          - autodiscover.plexuz.xyz
          - mta-sts.plexuz.xyz
        parentRefs:
          - name: gateway-external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *httpPort
    serviceMonitor:
      app:
        serviceName: *app
        endpoints:
          - port: http
            path: /metrics/prometheus
            interval: 1m
            scrapeTimeout: 10s
    persistence:
      config:
        type: configMap
        name: stalwart-config
        globalMounts:
          - path: /etc/stalwart/config.json
            subPath: config.json
            readOnly: true
      certs:
        type: secret
        name: stalwart-tls
        globalMounts:
          - path: /etc/stalwart/certs
            readOnly: true
