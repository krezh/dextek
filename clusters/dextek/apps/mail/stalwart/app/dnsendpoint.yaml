---
# yaml-language-server: $schema=https://kubernetes-schemas.plexuz.xyz/externaldns.k8s.io/dnsendpoint_v1alpha1.json
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: stalwart
  labels:
    external-dns.alpha.kubernetes.io/provider: cloudflare
spec:
  endpoints:
    - dnsName: mail.plexuz.xyz
      recordType: A
      targets:
        - 62.238.2.224
    - dnsName: plexuz.xyz
      recordType: MX
      targets:
        - 10 mail.plexuz.xyz
    - dnsName: plexuz.xyz
      recordType: TXT
      targets:
        - "v=spf1 ip4:62.238.2.224 ~all"
    - dnsName: _dmarc.plexuz.xyz
      recordType: TXT
      targets:
        - "v=DMARC1; p=quarantine; rua=mailto:dmarc@plexuz.xyz; fo=1; pct=100"
    - dnsName: _mta-sts.plexuz.xyz
      recordType: TXT
      targets:
        - "v=STSv1; id=2026103001"
    - dnsName: _smtp._tls.plexuz.xyz
      recordType: TXT
      targets:
        - "v=TLSRPTv1; rua=mailto:tls-reports@plexuz.xyz"
    - dnsName: autoconfig.plexuz.xyz
      recordType: CNAME
      targets:
        - ingress-ext.plexuz.xyz
    - dnsName: autodiscover.plexuz.xyz
      recordType: CNAME
      targets:
        - ingress-ext.plexuz.xyz
    - dnsName: mta-sts.plexuz.xyz
      recordType: CNAME
      targets:
        - ingress-ext.plexuz.xyz
    - dnsName: _imaps._tcp.plexuz.xyz
      recordType: SRV
      targets:
        - 0 1 993 mail.plexuz.xyz
    - dnsName: _submissions._tcp.plexuz.xyz
      recordType: SRV
      targets:
        - 0 1 465 mail.plexuz.xyz
    - dnsName: _sieve._tcp.plexuz.xyz
      recordType: SRV
      targets:
        - 0 1 4190 mail.plexuz.xyz
