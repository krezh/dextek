---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app trawl
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: trawl
  values:
    controllers:
      trawl:
        containers:
          app:
            image:
              repository: ghcr.io/germondai/trawl
              tag: 1.4.0@sha256:b8d81faa832f0417dbdeb2684c395a8405fb85739bbb89b19c019cdc3131814c
            env:
              BROWSER_POOL_SIZE: 3
              REDIS_URL: redis://dragonfly.databases.svc.cluster.local:6379/2
              MITM_PROXY_ENABLED: true
              MITM_PROXY_PORT: 8192
              MITM_PROXY_CA_DIR: /data/proxy-ca # persist the CA (mount a volume)
              MITM_PROXY_MAX_TIER: 4 # cap escalation (e.g. 3 to stay off residential)
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 8191
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 3
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 12
            resources:
              requests:
                cpu: 10m
                memory: 410M
              limits:
                memory: 3Gi
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    persistence:
      shm:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
        globalMounts:
          - path: /dev/shm
      data:
        type: emptyDir
        medium: Memory
        sizeLimit: 100Mi
