---
# yaml-language-server: $schema=https://kubernetes-schemas.plexuz.xyz/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app sabnzbd
  namespace: flux-system
spec:
  targetNamespace: downloads
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: external-secrets-stores
  path: ./clusters/dextek/apps/downloads/sabnzbd/app
  prune: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  components:
    - ../../../../../shared/components/oidc-auth
    - ../../../../../shared/components/kopiur/backup
  postBuild:
    substitute:
      APP: *app
      KOPIUR_CLAIM: sabnzbd-config
      KOPIUR_CAPACITY: 10Gi
      OIDC_HOST: sab.plexuz.xyz
      OIDC_INFISICAL_FOLDER: SABnzbd
      OIDC_TARGET: sabnzbd-app
