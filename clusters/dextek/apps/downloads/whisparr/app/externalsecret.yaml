---
# yaml-language-server: $schema=https://kubernetes-schemas.plexuz.xyz/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: whisparr
  namespace: downloads
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: whisparr-secret
    template:
      data:
        WHISPARR__AUTH__APIKEY: "{{ .WHISPARR_API_KEY }}"
  data:
    - secretKey: WHISPARR_API_KEY
      remoteRef:
        key: /Kubernetes/DexTek/Whisparr/WHISPARR_API_KEY
