---
# yaml-language-server: $schema=https://kubernetes-schemas.plexuz.xyz/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crowdsec
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: crowdsec-secret
    template:
      data:
        BOUNCER_KEY_ENVOY: "{{ .CROWDSEC_BOUNCER_KEY }}"
        ENROLL_KEY: "{{ .CROWDSEC_ENROLL_KEY }}"
  data:
    - secretKey: CROWDSEC_BOUNCER_KEY
      remoteRef:
        key: /Kubernetes/DexTek/CrowdSec/CROWDSEC_BOUNCER_KEY
    - secretKey: CROWDSEC_ENROLL_KEY
      remoteRef:
        key: /Kubernetes/DexTek/CrowdSec/CROWDSEC_ENROLL_KEY
