---
# yaml-language-server: $schema=https://kubernetes-schemas.plexuz.xyz/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crowdsec
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: crowdsec
  install:
    disableSchemaValidation: true
  upgrade:
    disableSchemaValidation: true
  values:
    container_runtime: containerd
    image:
      repository: mirror.gcr.io/crowdsecurity/crowdsec
    config:
      parsers:
        s02-enrich:
          xilo-cache-whitelist.yaml: |
            name: dextek/xilo-cache-whitelist
            description: Exclude Nix cache protocol requests from HTTP attack scenarios
            filter: "evt.Meta.log_type == 'http_access-log' && evt.Meta.target_fqdn == 'xilo.plexuz.xyz' && evt.Meta.http_verb in ['GET', 'HEAD']"
            whitelist:
              reason: Nix cache misses and parallel downloads are normal client behavior
              expression:
                - "evt.Meta.http_path matches '^/c/[^/]+/[^/]+/(nix-cache-info|[0-9abcdfghijklmnpqrsvwxyz]{32}[.]narinfo|nar/[0-9abcdfghijklmnpqrsvwxyz]{32}[.]nar)$'"
    lapi:
      env:
        - name: USE_WAL
          value: "true"
      envFrom:
        - secretRef:
            name: &secret crowdsec-secret
      podAnnotations:
        secret.reloader.stakater.com/reload: *secret
      metrics:
        serviceMonitor:
          enabled: true
    agent:
      isDeployment: true
      hostVarLog: false
      serviceAccountName: crowdsec-agent
      additionalAcquisition:
        - source: kubernetes
          namespace: network
          selector: gateway.envoyproxy.io/owning-gateway-name=gateway-external
          labels:
            type: envoy
        - source: kubernetes
          namespace: auth
          selector: app.kubernetes.io/name=authentik,app.kubernetes.io/component=server
          labels:
            type: authentik
        - source: kubernetes
          namespace: default
          selector: app.kubernetes.io/name=jellyfin,app.kubernetes.io/controller=jellyfin
          labels:
            type: jellyfin
        - source: kubernetes
          namespace: immich
          selector: app.kubernetes.io/name=immich,app.kubernetes.io/controller=server
          labels:
            type: immich
        - source: kubernetes
          namespace: downloads
          selector: app.kubernetes.io/name=radarr,app.kubernetes.io/controller=app
          labels:
            type: Radarr
        - source: kubernetes
          namespace: downloads
          selector: app.kubernetes.io/name=sonarr,app.kubernetes.io/controller=app
          labels:
            type: Sonarr
        - source: kubernetes
          namespace: downloads
          selector: app.kubernetes.io/name=prowlarr,app.kubernetes.io/controller=app
          labels:
            type: Prowlarr
      env:
        - name: COLLECTIONS
          value: >-
            yanis-kouidri/envoy
            firix/authentik
            LePresidente/jellyfin
            gauth-fr/immich
            schiz0phr3ne/radarr
            schiz0phr3ne/sonarr
            schiz0phr3ne/prowlarr
      metrics:
        serviceMonitor:
          enabled: true
