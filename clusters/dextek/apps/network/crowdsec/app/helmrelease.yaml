---
# yaml-language-server: $schema=https://kubernetes-schemas.plexuz.xyz/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crowdsec
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: crowdsec
  values:
    container_runtime: containerd
    image:
      repository: mirror.gcr.io/crowdsecurity/crowdsec
    config:
      parsers:
        s02-enrich:
          xilo-cache-whitelist.yaml: |
            name: dextek/xilo-cache-whitelist
            description: Exclude Nix cache protocol requests from HTTP attack scenarios
            filter: "evt.Meta.log_type == 'http_access-log' && evt.Meta.target_fqdn == 'xilo.plexuz.xyz' && evt.Meta.http_verb in ['GET', 'HEAD']"
            whitelist:
              reason: Nix cache misses and parallel downloads are normal client behavior
              expression:
                - "evt.Meta.http_path matches '^/c/[^/]+/[^/]+/(nix-cache-info|[0-9abcdfghijklmnpqrsvwxyz]{32}[.]narinfo|nar/[0-9abcdfghijklmnpqrsvwxyz]{32}[.]nar)$'"
    lapi:
      envFrom:
        - secretRef:
            name: &secret crowdsec-secret
      podAnnotations:
        secret.reloader.stakater.com/reload: *secret
      metrics:
        serviceMonitor:
          enabled: true
    agent:
      acquisition:
        - namespace: network
          podName: gateway-external-*
          program: envoy
      env:
        - name: COLLECTIONS
          value: yanis-kouidri/envoy
        - name: PARSERS
          value: crowdsecurity/cri-logs
      metrics:
        serviceMonitor:
          enabled: true
