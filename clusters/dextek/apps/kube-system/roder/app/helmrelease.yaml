---
# yaml-language-server: $schema=https://kubernetes-schemas.plexuz.xyz/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: roder
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: roder
  values:
    replicaCount: 2
    podAnnotations:
      reloader.stakater.com/auto: "true"
    envFrom:
      - secretRef:
          name: roder-secret
    talos:
      enabled: true
      roles:
        - os:admin
      actions:
        enabled: true
        operatorGroups: ["superuser"]
      config:
        enabled: true
        readerGroups: ["superuser"]
    alertmanager:
      url: http://alertmanager-operated.monitoring.svc.cluster.local:9093
      readerGroups: ["superuser"]
      actions:
        enabled: true
        operatorGroups: ["superuser"]
    resources:
      requests:
        cpu: 50m
        memory: 300Mi
      limits:
        memory: 400Mi
    httpRoute:
      enabled: true
      annotations:
        gatus.home-operations.com/endpoint: |-
          url: https://roder.plexuz.xyz/health
      parentRefs:
        - name: gateway-internal
          namespace: network
      hostnames: ["roder.plexuz.xyz"]
