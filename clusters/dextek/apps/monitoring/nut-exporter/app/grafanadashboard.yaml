---
# yaml-language-server: $schema=https://kubernetes-schemas.plexuz.xyz/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: nut-exporter
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasources:
    - datasourceName: prometheus
      inputName: DS_PROMETHEUS
  json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(255, 96, 96, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "description": "Operational power, battery, runtime, electrical quality, and UPS state monitoring from the NUT Prometheus exporter.",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Composite severity. Attention includes on-battery, replace-battery, bypass, boost, or calibration.",
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "mappings": [
                {
                  "options": {
                    "0": {
                      "color": "green",
                      "index": 0,
                      "text": "ONLINE"
                    },
                    "1": {
                      "color": "orange",
                      "index": 1,
                      "text": "ATTENTION"
                    },
                    "2": {
                      "color": "red",
                      "index": 2,
                      "text": "CRITICAL"
                    }
                  },
                  "type": "value"
                }
              ],
              "overrides": [],
              "thresholds": {
                "color": {
                  "mode": "thresholds"
                },
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green"
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 2
                  }
                ]
              }
            },
            "options": {
              "colorMode": "background",
              "graphMode": "none",
              "justifyMode": "center",
              "orientation": "auto",
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ],
                "fields": "",
                "values": false
              },
              "showPercentChange": false,
              "textMode": "value_and_name",
              "wideLayout": true
            },
            "overrides": []
          },
          "gridPos": {
            "h": 6,
            "w": 4,
            "x": 0,
            "y": 0
          },
          "id": 2,
          "targets": [
            {
              "expr": "max by (target, ups) (nut_ups_status{target=~\"${target:regex}\",ups=~\"${ups:regex}\",status=~\"LB|FSD|OFF|SD\"} * 2) + max by (target, ups) (nut_ups_status{target=~\"${target:regex}\",ups=~\"${ups:regex}\",status=~\"OB|RB|BYPASS|BOOST|CP\"})",
              "instant": true,
              "legendFormat": "{{ups}}",
              "refId": "A"
            }
          ],
          "title": "POWER STATE",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Current battery charge reported by NUT.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0,
              "mappings": [],
              "max": 1,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red"
                  },
                  {
                    "color": "orange",
                    "value": 0.2
                  },
                  {
                    "color": "yellow",
                    "value": 0.5
                  },
                  {
                    "color": "green",
                    "value": 0.8
                  }
                ]
              },
              "unit": "percentunit"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 6,
            "w": 4,
            "x": 4,
            "y": 0
          },
          "id": 3,
          "options": {
            "minVizHeight": 75,
            "minVizWidth": 75,
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showThresholdLabels": false,
            "showThresholdMarkers": true,
            "sizing": "auto"
          },
          "targets": [
            {
              "expr": "nut_battery_charge{target=~\"${target:regex}\",ups=~\"${ups:regex}\"}",
              "instant": true,
              "legendFormat": "{{ups}}",
              "refId": "A"
            }
          ],
          "title": "BATTERY",
          "type": "gauge"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red"
                  },
                  {
                    "color": "orange",
                    "value": 300
                  },
                  {
                    "color": "yellow",
                    "value": 600
                  },
                  {
                    "color": "green",
                    "value": 1200
                  }
                ]
              },
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 6,
            "w": 4,
            "x": 8,
            "y": 0
          },
          "id": 4,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "value",
            "wideLayout": true
          },
          "targets": [
            {
              "expr": "nut_battery_runtime_seconds{target=~\"${target:regex}\",ups=~\"${ups:regex}\"}",
              "instant": true,
              "legendFormat": "{{ups}}",
              "refId": "A"
            }
          ],
          "title": "RUNTIME RESERVE",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0,
              "max": 1,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green"
                  },
                  {
                    "color": "yellow",
                    "value": 0.6
                  },
                  {
                    "color": "orange",
                    "value": 0.8
                  },
                  {
                    "color": "red",
                    "value": 0.9
                  }
                ]
              },
              "unit": "percentunit"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 6,
            "w": 4,
            "x": 12,
            "y": 0
          },
          "id": 5,
          "options": {
            "minVizHeight": 75,
            "minVizWidth": 75,
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showThresholdLabels": false,
            "showThresholdMarkers": true,
            "sizing": "auto"
          },
          "targets": [
            {
              "expr": "nut_load{target=~\"${target:regex}\",ups=~\"${ups:regex}\"}",
              "instant": true,
              "legendFormat": "{{ups}}",
              "refId": "A"
            }
          ],
          "title": "UPS LOAD",
          "type": "gauge"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "continuous-GrYlRd"
              },
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green"
                  },
                  {
                    "color": "yellow",
                    "value": 700
                  },
                  {
                    "color": "red",
                    "value": 950
                  }
                ]
              },
              "unit": "watt"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 6,
            "w": 4,
            "x": 16,
            "y": 0
          },
          "id": 6,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "value",
            "wideLayout": true
          },
          "targets": [
            {
              "expr": "nut_real_power_watts{target=~\"${target:regex}\",ups=~\"${ups:regex}\"}",
              "instant": true,
              "legendFormat": "{{ups}}",
              "refId": "A"
            }
          ],
          "title": "REAL OUTPUT",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Seconds since the selected NUT target last emitted exporter data.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green"
                  },
                  {
                    "color": "orange",
                    "value": 60
                  },
                  {
                    "color": "red",
                    "value": 180
                  }
                ]
              },
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 6,
            "w": 4,
            "x": 20,
            "y": 0
          },
          "id": 7,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "value",
            "wideLayout": true
          },
          "targets": [
            {
              "expr": "time() - timestamp(nut_info{target=~\"${target:regex}\"})",
              "instant": true,
              "legendFormat": "{{target}}",
              "refId": "A"
            }
          ],
          "title": "TELEMETRY AGE",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "fixedColor": "semi-dark-blue",
                "mode": "fixedColor"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue"
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 16,
            "x": 0,
            "y": 6
          },
          "id": 8,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "name",
            "wideLayout": true
          },
          "targets": [
            {
              "expr": "nut_ups_info{target=~\"${target:regex}\",ups=~\"${ups:regex}\"}",
              "instant": true,
              "legendFormat": "{{manufacturer}} {{model}}  ·  {{ups_type}}  ·  battery: {{battery_type}}  ·  NUT {{nut_version}}",
              "refId": "A"
            }
          ],
          "title": "CONNECTED EQUIPMENT",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Each active NUT state is shown explicitly with its full meaning and severity.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "mappings": [
                {
                  "options": {
                    "1": {
                      "index": 0,
                      "text": "ACTIVE"
                    }
                  },
                  "type": "value"
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green"
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": "(LB|FSD|OFF|SD).*"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "fixedColor": "red",
                      "mode": "fixed"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": "(OB|RB|BYPASS|BOOST|CP).*"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "fixedColor": "orange",
                      "mode": "fixed"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": "OL.*"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "fixedColor": "green",
                      "mode": "fixed"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": "CHRG.*"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "fixedColor": "blue",
                      "mode": "fixed"
                    }
                  }
                ]
              }
            ]
          },
          "gridPos": {
            "h": 4,
            "w": 8,
            "x": 16,
            "y": 6
          },
          "id": 16,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "name",
            "wideLayout": true
          },
          "targets": [
            {
              "expr": "nut_ups_status{target=~\"${target:regex}\",ups=~\"${ups:regex}\",status=\"OL\"} == 1",
              "instant": true,
              "legendFormat": "OL · Online",
              "refId": "A"
            },
            {
              "expr": "nut_ups_status{target=~\"${target:regex}\",ups=~\"${ups:regex}\",status=\"OB\"} == 1",
              "instant": true,
              "legendFormat": "OB · On battery",
              "refId": "B"
            },
            {
              "expr": "nut_ups_status{target=~\"${target:regex}\",ups=~\"${ups:regex}\",status=\"LB\"} == 1",
              "instant": true,
              "legendFormat": "LB · Low battery",
              "refId": "C"
            },
            {
              "expr": "nut_ups_status{target=~\"${target:regex}\",ups=~\"${ups:regex}\",status=\"CHRG\"} == 1",
              "instant": true,
              "legendFormat": "CHRG · Charging",
              "refId": "D"
            },
            {
              "expr": "nut_ups_status{target=~\"${target:regex}\",ups=~\"${ups:regex}\",status=\"RB\"} == 1",
              "instant": true,
              "legendFormat": "RB · Replace battery",
              "refId": "E"
            },
            {
              "expr": "nut_ups_status{target=~\"${target:regex}\",ups=~\"${ups:regex}\",status=\"FSD\"} == 1",
              "instant": true,
              "legendFormat": "FSD · Forced shutdown",
              "refId": "F"
            },
            {
              "expr": "nut_ups_status{target=~\"${target:regex}\",ups=~\"${ups:regex}\",status=\"BYPASS\"} == 1",
              "instant": true,
              "legendFormat": "BYPASS · Bypass active",
              "refId": "G"
            },
            {
              "expr": "nut_ups_status{target=~\"${target:regex}\",ups=~\"${ups:regex}\",status=\"SD\"} == 1",
              "instant": true,
              "legendFormat": "SD · Shutdown",
              "refId": "H"
            },
            {
              "expr": "nut_ups_status{target=~\"${target:regex}\",ups=~\"${ups:regex}\",status=\"CP\"} == 1",
              "instant": true,
              "legendFormat": "CP · Calibration",
              "refId": "I"
            },
            {
              "expr": "nut_ups_status{target=~\"${target:regex}\",ups=~\"${ups:regex}\",status=\"BOOST\"} == 1",
              "instant": true,
              "legendFormat": "BOOST · Voltage boost",
              "refId": "J"
            },
            {
              "expr": "nut_ups_status{target=~\"${target:regex}\",ups=~\"${ups:regex}\",status=\"OFF\"} == 1",
              "instant": true,
              "legendFormat": "OFF · Output off",
              "refId": "K"
            }
          ],
          "title": "ACTIVE UPS FLAGS",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Battery charge and UPS load share the normalized 0–100% scale.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisPlacement": "auto",
                "drawStyle": "line",
                "fillOpacity": 18,
                "gradientMode": "opacity",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "scaleDistribution": {
                  "type": "linear"
                },
                "showPoints": "never",
                "spanNulls": true,
                "stacking": {
                  "group": "A",
                  "mode": "none"
                },
                "thresholdsStyle": {
                  "mode": "area"
                }
              },
              "max": 1,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "transparent"
                  },
                  {
                    "color": "rgba(255, 152, 48, 0.2)",
                    "value": 0.8
                  },
                  {
                    "color": "rgba(245, 54, 54, 0.25)",
                    "value": 0.9
                  }
                ]
              },
              "unit": "percentunit"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 10
          },
          "id": 9,
          "options": {
            "legend": {
              "calcs": [
                "lastNotNull",
                "min",
                "max"
              ],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "hideZeros": false,
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "nut_battery_charge{target=~\"${target:regex}\",ups=~\"${ups:regex}\"}",
              "legendFormat": "Battery · {{ups}}",
              "refId": "A"
            },
            {
              "expr": "nut_load{target=~\"${target:regex}\",ups=~\"${ups:regex}\"}",
              "legendFormat": "Load · {{ups}}",
              "refId": "B"
            }
          ],
          "title": "ENERGY RESERVES",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisPlacement": "auto",
                "drawStyle": "line",
                "fillOpacity": 20,
                "gradientMode": "opacity",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "scaleDistribution": {
                  "type": "linear"
                },
                "showPoints": "never",
                "spanNulls": true,
                "stacking": {
                  "group": "A",
                  "mode": "none"
                },
                "thresholdsStyle": {
                  "mode": "off"
                }
              },
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green"
                  }
                ]
              },
              "unit": "watt"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 10
          },
          "id": 10,
          "options": {
            "legend": {
              "calcs": [
                "lastNotNull",
                "mean",
                "max"
              ],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "hideZeros": false,
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "nut_real_power_watts{target=~\"${target:regex}\",ups=~\"${ups:regex}\"}",
              "legendFormat": "Real · {{ups}}",
              "refId": "A"
            },
            {
              "expr": "nut_power_watts{target=~\"${target:regex}\",ups=~\"${ups:regex}\"}",
              "legendFormat": "Apparent · {{ups}}",
              "refId": "B"
            }
          ],
          "title": "POWER FLOW",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Two-minute average input voltage against the UPS nominal reference. Output voltage tracks input on this line-interactive UPS.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "fixedColor": "blue",
                "mode": "fixed"
              },
              "custom": {
                "axisPlacement": "auto",
                "axisSoftMax": 240,
                "axisSoftMin": 225,
                "drawStyle": "line",
                "fillOpacity": 10,
                "gradientMode": "none",
                "lineInterpolation": "smooth",
                "lineWidth": 4,
                "scaleDistribution": {
                  "type": "linear"
                },
                "showPoints": "never",
                "spanNulls": true,
                "stacking": {
                  "group": "A",
                  "mode": "none"
                },
                "thresholdsStyle": {
                  "mode": "off"
                }
              },
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green"
                  }
                ]
              },
              "unit": "volt"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": "Mains.*"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "fixedColor": "blue",
                      "mode": "fixed"
                    }
                  },
                  {
                    "id": "custom.lineWidth",
                    "value": 4
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": "Nominal.*"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "fixedColor": "orange",
                      "mode": "fixed"
                    }
                  },
                  {
                    "id": "custom.lineStyle",
                    "value": {
                      "dash": [
                        6,
                        6
                      ],
                      "fill": "dash"
                    }
                  },
                  {
                    "id": "custom.lineWidth",
                    "value": 2
                  },
                  {
                    "id": "custom.fillOpacity",
                    "value": 0
                  }
                ]
              }
            ]
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
