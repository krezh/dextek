---
# yaml-language-server: $schema=https://kubernetes-schemas.plexuz.xyz/notification.toolkit.fluxcd.io/provider_v1.json
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Provider
metadata:
  name: github
spec:
  type: github
  address: https://github.com/krezh/dextek
  secretRef:
    name: github-token-secret
---
# yaml-language-server: $schema=https://kubernetes-schemas.plexuz.xyz/notification.toolkit.fluxcd.io/alert_v1.json
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Alert
metadata:
  name: github
spec:
  providerRef:
    name: github
  eventSeverity: info
  eventMetadata:
    cluster: DexTek
  eventSources:
    - kind: Kustomization
      name: "*"
