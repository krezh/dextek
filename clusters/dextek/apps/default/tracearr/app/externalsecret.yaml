---
# yaml-language-server: $schema=https://kubernetes-schemas.plexuz.xyz/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tracearr
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: tracearr-secret
    template:
      engineVersion: v2
      data:
        JWT_SECRET: "{{ .TRACEARR_JWT_SECRET }}"
        COOKIE_SECRET: "{{ .TRACEARR_COOKIE_SECRET }}"
        ENCRYPTION_KEY: "{{ .TRACEARR_ENCRYPTION_KEY }}"
        REDIS_URL: "redis://dragonfly.databases.svc.cluster.local.:6379/10"
        MAXMIND_LICENSE_KEY: "{{ .MAXMIND_LICENSE_KEY }}"
        OIDC_ISSUER_URL: https://sso.plexuz.xyz/application/o/tracearr
        OIDC_CLIENT_ID: "{{ .OAUTH_CLIENT_ID }}"
        OIDC_CLIENT_SECRET: "{{ .OAUTH_CLIENT_SECRET }}"
        OIDC_PROVIDER_NAME: Authentik
  data:
    - secretKey: TRACEARR_JWT_SECRET
      remoteRef:
        key: /Kubernetes/DexTek/Tracearr/TRACEARR_JWT_SECRET
    - secretKey: TRACEARR_COOKIE_SECRET
      remoteRef:
        key: /Kubernetes/DexTek/Tracearr/TRACEARR_COOKIE_SECRET
    - secretKey: TRACEARR_ENCRYPTION_KEY
      remoteRef:
        key: /Kubernetes/DexTek/Tracearr/TRACEARR_ENCRYPTION_KEY
    - secretKey: MAXMIND_LICENSE_KEY
      remoteRef:
        key: /Kubernetes/DexTek/Maxmind/MAXMIND_LICENSE_KEY
    - secretKey: OAUTH_CLIENT_ID
      remoteRef:
        key: /Kubernetes/DexTek/Tracearr/OAUTH_CLIENT_ID
    - secretKey: OAUTH_CLIENT_SECRET
      remoteRef:
        key: /Kubernetes/DexTek/Tracearr/OAUTH_CLIENT_SECRET
