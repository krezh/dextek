---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app tracearr
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: tracearr
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      app:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/connorgallopo/tracearr
              tag: 2.8.3@sha256:df06e1a22b7eda67929a3076c5fe4ad2e03df8f92324ab09c2f3b18137a82c83
            env:
              TRUST_PROXY: true
              CORS_ORIGIN: https://tracearr.plexuz.xyz
              DNS_CACHE_MAX_TTL: 3600
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: tracearr-postgres
                    key: url
            envFrom:
              - secretRef:
                  name: tracearr-secret
            resources:
              requests:
                cpu: 10m
                memory: 250M
              limits:
                memory: 1036M
    service:
      app:
        controller: app
        ports:
          http:
            port: &port 3000
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.plexuz.xyz"
        parentRefs:
          - name: gateway-external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *port
    persistence:
      backup:
        size: 10Gi
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        globalMounts:
          - path: /data/backup
      image-cache:
        size: 10Gi
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        globalMounts:
          - path: /data/tracearr/image-cache
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
            subPath: tmp
