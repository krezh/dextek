---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: donetick
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: donetick
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      donetick:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/donetick/donetick
              tag: v0.1.79@sha256:a1cc21dd5a37acb5009009f13e5d2529153049361afb0a1cd94bde312382d36a
            env:
              TZ: Europe/Stockholm
              DT_ENV: selfhosted
              DT_SQLITE_PATH: /data/donetick.db
              DT_SERVER_PORT: &port 2021
              DT_SERVER_PUBLIC_HOST: https://donetick.plexuz.xyz
              DT_SERVER_CORS_ALLOW_ORIGINS: https://donetick.plexuz.xyz,capacitor://localhost,https://localhost,http://localhost
              DT_IS_USER_CREATION_DISABLED: true
              DT_OAUTH2_NAME: Authentik
              DT_OAUTH2_CLIENT_ID: donetick
              DT_OAUTH2_AUTH_URL: https://sso.plexuz.xyz/application/o/authorize/
              DT_OAUTH2_TOKEN_URL: https://sso.plexuz.xyz/application/o/token/
              DT_OAUTH2_USER_INFO_URL: https://sso.plexuz.xyz/application/o/userinfo/
              DT_OAUTH2_REDIRECT_URL: https://donetick.plexuz.xyz/auth/oauth2
              DT_OAUTH2_SCOPES: openid,profile,email
              DT_OAUTH2_ADMIN_GROUPS: superuser
            envFrom:
              - secretRef:
                  name: donetick-secret
              - secretRef:
                  name: donetick-jwt-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 512Mi
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.plexuz.xyz"
        parentRefs:
          - name: gateway-external
            namespace: network
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /data
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
