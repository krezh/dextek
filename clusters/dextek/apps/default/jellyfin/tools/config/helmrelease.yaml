---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin-config
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: jellyfin-config
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      jellyfin-config:
        annotations:
          reloader.stakater.com/auto: "true"
        type: cronjob
        cronjob:
          schedule: 0 * * * *
          backoffLimit: 0
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 1
          ttlSecondsAfterFinished: 3600
        initContainers:
          pip-install:
            image:
              repository: public.ecr.aws/docker/library/python
              tag: 3.15-slim@sha256:3053ea19f29305df68292b41291d621e0cbc9c1c826822c631713891ea0b64e9
            command:
              - pip
              - install
              - "--target=/pip-packages"
              - "requests"
              - "pyyaml"
        containers:
          app:
            image:
              repository: public.ecr.aws/docker/library/python
              tag: 3.15-slim@sha256:3053ea19f29305df68292b41291d621e0cbc9c1c826822c631713891ea0b64e9
            command: ["python", "/scripts/jellyfin-config.py"]
            env:
              JELLYFIN_URL: http://jellyfin.default.svc.cluster.local:8096
              PYTHONPATH: /pip-packages
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 512M
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
        pod:
          hostUsers: false
          restartPolicy: Never
    persistence:
      script:
        type: configMap
        name: "{{ .Release.Name }}-scripts"
        globalMounts:
          - path: /scripts/jellyfin-config.py
            subPath: jellyfin-config.py
            readOnly: true
      config:
        type: secret
        name: "{{ .Release.Name }}-secret"
        advancedMounts:
          jellyfin-config:
            app:
              - path: /config/config.yaml
                subPath: config.yaml
                readOnly: true
      tmpfs:
        type: emptyDir
        advancedMounts:
          jellyfin-config:
            app:
              - path: /pip-packages
                subPath: pip-packages
              - path: /tmp
                subPath: tmp
            pip-install:
              - path: /pip-packages
                subPath: pip-packages
              - path: /tmp
                subPath: tmp-pip
