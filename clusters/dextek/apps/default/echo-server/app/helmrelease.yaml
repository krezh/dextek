---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: echo-server
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: echo-server
  values:
    replicaCount: 2
    resources:
      requests:
        cpu: 10m
      limits:
        memory: 64Mi
    httpRoute:
      enabled: true
      annotations:
        gatus.home-operations.com/endpoint: |-
          url: https://{{ .Release.Name }}.plexuz.xyz/healthz
      hostnames:
        - "{{ .Release.Name }}.plexuz.xyz"
        - echo.plexuz.xyz
      parentRefs:
        - name: gateway-external
          namespace: network
    monitoring:
      serviceMonitor:
        enabled: true
