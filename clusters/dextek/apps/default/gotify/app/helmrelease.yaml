---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gotify
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: gotify
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      gotify:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/gotify/server
              tag: 3.1.0@sha256:be44495e4609c6f5b06c01a9445ec6198dba902ce49fc3d0d71ab585cda8014c
            env:
              GOTIFY_DATABASE_CONNECTION:
                valueFrom:
                  secretKeyRef:
                    name: gotify-postgres
                    key: url
              GOTIFY_DATABASE_DIALECT: postgres
              GOTIFY_OIDC_ENABLED: true
              GOTIFY_OIDC_ISSUER: https://sso.plexuz.xyz/application/o/gotify/
              GOTIFY_OIDC_LINK_BY_USERNAME: true
              GOTIFY_OIDC_REDIRECTURL: https://gotify.plexuz.xyz/auth/oidc/callback
              GOTIFY_OIDC_GROUPS_CLAIM: groups
              GOTIFY_OIDC_GROUPS_USER: gotify-users
              GOTIFY_OIDC_GROUPS_ADMIN: superuser
              GOTIFY_LOCALAUTH_ENABLED: false
              GOTIFY_SERVER_PORT: &port 8080
              GOTIFY_SERVER_SECURECOOKIE: true
            envFrom:
              - secretRef:
                  name: gotify-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 5m
                memory: 50Mi
              limits:
                memory: 150Mi
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.plexuz.xyz"
        parentRefs:
          - name: gateway-external
            namespace: network
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /app/data
