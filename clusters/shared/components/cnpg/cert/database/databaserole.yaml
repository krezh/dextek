---
# yaml-language-server: $schema=https://kubernetes-schemas.plexuz.xyz/postgresql.cnpg.io/databaserole_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: ${APP}
spec:
  cluster:
    name: postgres
  name: ${DATABASE_OWNER:=${APP}}
  ensure: present
  login: true
  superuser: false
